name: Release mac app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release secrets
        env:
          MORN_NOTARY_TOKEN: ${{ secrets.MORN_NOTARY_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          for name in MORN_NOTARY_TOKEN HOMEBREW_TAP_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is not set. Register it in repository Actions secrets."
              exit 1
            fi
          done

      - name: Build
        run: |
          set -euo pipefail
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Support/Info.plist)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          VERSION="$VERSION" UNIVERSAL=1 zsh build.sh

      - name: Sign & notarize via MornNotary
        env:
          GH_TOKEN: ${{ secrets.MORN_NOTARY_TOKEN }}
        run: |
          set -euo pipefail
          SUBMIT_ZIP="$(mktemp -d)/MornStorage.zip"
          ditto -c -k --keepParent dist/MornStorage.app "$SUBMIT_ZIP"

          WORKDIR="$(mktemp -d)"
          git clone --depth 1 --branch main --single-branch "https://x-access-token:${GH_TOKEN}@github.com/matsufriends/MornNotary.git" "$WORKDIR"
          cd "$WORKDIR"
          REQUEST_BRANCH="sign/mornstorage-${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$REQUEST_BRANCH"
          cp "$SUBMIT_ZIP" "$WORKDIR/incoming/MornStorage.zip"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add incoming/MornStorage.zip
          git commit -m "request: sign MornStorage v${VERSION}"
          git push -u origin "$REQUEST_BRANCH"
          SHA="$(git rev-parse HEAD)"

          RUN_ID=""
          for i in $(seq 1 30); do
            RUN_ID=$(gh run list --repo matsufriends/MornNotary --workflow sign.yml \
              --branch "$REQUEST_BRANCH" --commit "$SHA" --event push \
              --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::MornNotary workflow run did not start for commit $SHA"
            exit 1
          fi
          echo "MornNotary run: $RUN_ID"
          gh run watch "$RUN_ID" --repo matsufriends/MornNotary --exit-status

          OUTDIR="$(mktemp -d)"
          gh run download "$RUN_ID" --repo matsufriends/MornNotary --name "MornStorage-signed" --dir "$OUTDIR"
          SIGNED_ZIP="$(find "$OUTDIR" -name '*.zip' | head -1)"
          if [ -z "$SIGNED_ZIP" ]; then
            echo "::error::Signed artifact not found in MornNotary run output"
            exit 1
          fi

          cd "$GITHUB_WORKSPACE"
          mv dist/MornStorage.app "$OUTDIR/unsigned.app"
          ditto -x -k "$SIGNED_ZIP" dist
          codesign --verify --deep --strict --verbose=2 dist/MornStorage.app
          xcrun stapler validate dist/MornStorage.app
          git -C "$WORKDIR" push origin --delete "$REQUEST_BRANCH"

      - name: Zip app
        run: |
          cd dist
          ditto -c -k --keepParent MornStorage.app MornStorage.app.zip

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/MornStorage.app.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/MornStorage.app.zip --repo "$GITHUB_REPOSITORY" --generate-notes
          fi

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          SHA="$(shasum -a 256 dist/MornStorage.app.zip | awk '{print $1}')"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/TsukumiStudio/homebrew-tap.git" tap
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            git -C tap push --dry-run origin HEAD:main
            echo "Trial completed; release and Homebrew cask were not changed."
            exit 0
          fi
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/${VERSION}/g" -e "s/@SHA256@/${SHA}/g" Support/mornstorage.rb.in > tap/Casks/mornstorage.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/mornstorage.rb
          git diff --cached --quiet || { git commit -m "mornstorage ${VERSION}"; git push; }
